spring.application.name=api-java
# Mismo puerto que la API de Node: los módulos de la tienda no cambian.
server.port=${PORT:4510}

# Base de datos H2 guardada en un archivo (data/tienda.mv.db): no hay que instalar nada.
spring.datasource.url=jdbc:h2:file:./data/tienda
# Crea y actualiza las tablas a partir de las clases @Entity.
spring.jpa.hibernate.ddl-auto=update

# Ver la base de datos en el navegador: http://localhost:4510/h2-console
# JDBC URL: jdbc:h2:file:./data/tienda · usuario: sa · contraseña: (vacía)
spring.h2.console.enabled=false

